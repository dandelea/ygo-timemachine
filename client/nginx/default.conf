server {
  listen 3000;
  root /usr/share/nginx/html;

  # Vite fingerprints the bundled assets, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single page app: unknown paths are routes handled by the client.
  location / {
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
