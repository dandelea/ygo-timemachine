# Production-like stack: built images, PostgreSQL and Redis behind nginx.
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up --build
# The app is served on http://localhost:3050

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  api:
    build: ./server
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: postgres
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 2m

  client:
    build: ./client
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      start_period: 1m

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-3050}:80"

volumes:
  postgres-data:
