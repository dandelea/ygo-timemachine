# Production-like stack: built images, PostgreSQL and Redis behind nginx.
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up --build
# The app is served on http://localhost:3050

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  api:
    build: ./server
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: postgres
      REDIS_URL: redis://redis:6379

  client:
    build: ./client
    restart: unless-stopped

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - api
      - client
    ports:
      - "${HTTP_PORT:-3050}:80"

volumes:
  postgres-data:
