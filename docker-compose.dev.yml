# Development stack: Vite and the API in watch mode with the sources mounted,
# SQLite for storage and Redis as cache, behind the same nginx gateway.
#   docker compose -f docker-compose.dev.yml up --build
# The app is served on http://localhost:3050

services:
  redis:
    image: redis:8-alpine

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    init: true
    depends_on:
      - redis
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server/src:/app/src
      - api-db:/app/db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    init: true
    environment:
      API_PROXY_TARGET: http://api:5000
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html

  nginx:
    build: ./nginx
    depends_on:
      - api
      - client
    ports:
      - "${HTTP_PORT:-3050}:80"

volumes:
  api-db:
